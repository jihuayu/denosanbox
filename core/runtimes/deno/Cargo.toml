[package]
name = "denosanbox-deno"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "deno_core/V8 backend for denosanbox"
publish = false

[dependencies]
deno_core = "=0.413.0"
denosanbox-core = { path = "../../core", version = "0.1.0" }
serde_json = "1.0.145"
tokio = { version = "1.48", features = ["rt", "time", "sync"] }
