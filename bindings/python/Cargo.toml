[package]
name = "denosanbox-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native async Python bindings for the denosanbox facade"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
denosanbox = { path = "../../core", default-features = false }
pyo3 = { version = "0.23", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.23", features = ["tokio-runtime"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

[features]
# The real V8 backend is the production default. The `fake` feature is kept
# available so the binding can be built and contract-tested in environments
# where the Deno backend has not been generated yet.
default = ["deno"]
deno = ["denosanbox/deno"]
fake = ["denosanbox/fake"]
