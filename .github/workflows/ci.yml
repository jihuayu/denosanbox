name: native-library
on: [push, pull_request]
env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      # The workspace `rust-toolchain.toml` pins 1.99.1 (the validated
      # toolchain); the action below installs the lockfile's channel, so CI
      # builds exactly what the repository declares.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets --locked -- -D warnings
      # Real Deno/V8 suites: facade conformance, module profiles, mounts,
      # connectors/VFS, host bridge, runtime limits, host security, worker and
      # binding parity fixtures. `runtime_limits` includes one ignored,
      # documented pending-runtime-fix regression (not counted as passing).
      - run: cargo test --manifest-path core/Cargo.toml --workspace --all-features --locked
      # Engine-independent contract without V8 (fake backend + policy/modules).
      # Excludes `denosanbox-testkit`: that crate's compile-time fixture is the
      # real-JS binding parity corpus, not an engine-independent schema sample.
      - run: cargo test --manifest-path core/Cargo.toml --no-default-features -p denosanbox -p denosanbox-core -p denosanbox-policy -p denosanbox-modules --locked
      - run: cargo run --manifest-path core/Cargo.toml --example backend --locked
      # Smoke-only benchmark output (not the recorded measurement artifact).
      - run: cargo run --manifest-path core/Cargo.toml --example benchmark --locked -- 20
      - run: python3 dev/validate-fixtures.py
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'maturin>=1.7,<2.0' pytest pytest-asyncio
      - run: maturin build --manifest-path bindings/python/Cargo.toml --locked --out wheels
      - run: python -m pip install wheels/*.whl
      - run: python -m pytest bindings/python/tests
  node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: sh bindings/nodejs/build.sh
      - run: node --test bindings/nodejs/tests/*.test.cjs
  c-and-go:
    # Optional ABI products are still built and linked here so their
    # compatibility claims are backed by CI. Runs the C/Go owner's locked
    # script: C ABI examples (cc -std=c11 -Werror), `go test -race`, and the Go
    # example. No sidecar runtime is involved.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: cargo build --locked --manifest-path bindings/c/Cargo.toml
      - run: sh bindings/c/test.sh
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run boundaries --fuzz-dir core/fuzz -- -max_total_time=10 -max_len=8192
