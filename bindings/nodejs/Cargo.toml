[package]
name = "denosanbox-nodejs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
denosanbox = { path = "../../core" }
napi = { version = "3.16", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.7"
serde_json = "1"

[build-dependencies]
napi-build = "2.6"
